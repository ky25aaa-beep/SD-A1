<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Wordle Game</title>
</head>

<body>
    <h1 class="characters" aria-label="Wordle">
        <span>W</span><span>O</span><span>R</span><span>D</span><span>L</span><span>E</span>
    </h1>
    <!-- Options for choosing word length -->
    <div class="board">
        <!-- 1. Fixed "window.location.href" (lowercase "w" and "l") -->
        <div onclick="window.location.href='/play/5-letter/5-letter.html'" class="row hover-to-green" data-word-length="5" role="link" tabindex="0">
            <span class="character unknown">5</span>
            <span class="character unknown">-</span>
            <span class="character unknown">L</span>
            <span class="character unknown">E</span>
            <span class="character unknown">T</span>
            <span class="character unknown">T</span>
            <span class="character unknown">E</span>
            <span class="character unknown">R</span>
        </div>
        <div onclick="window.location.href='/play/no-colour/no-colour.html'" class="row hover-to-red" data-word-length="6" role="link" tabindex="0">
            <span class="character absent">N</span>
            <span class="character absent">O</span>
            <span class="character absent">-</span>
            <span class="character absent">C</span>
            <span class="character absent">O</span>
            <span class="character absent">L</span>
            <span class="character absent">O</span>
            <span class="character absent">R</span>
        </div>
        <div onclick="alert('No Workee')" class="row hover-to-red" data-word-length="7" role="link" tabindex="0">
            <span class="character absent">7</span>
            <span class="character absent">-</span>
            <span class="character absent">L</span>
            <span class="character absent">E</span>
            <span class="character absent">T</span>
            <span class="character absent">T</span>
            <!-- 2. Fixed the broken closing div tag -->
            <span class="character absent">E</span>
            <span class="character absent">R</span>
        </div>
    </div>
</body>
</html>
