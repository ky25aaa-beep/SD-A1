<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Play Wordle</title>
</head>
<body>
    <h1>Play Wordle</h1>

    <input type="text" id="guessInput" maxlength="5" placeholder="5-letter word">
    <button onclick="submitGuess()">Guess</button>
    <button onclick="newWord()">New Word</button>

    <p>Status: <span id="status"></span></p>
    <p>Known positions: <span id="known"></span></p>
    <p>Known letters (wrong position): <span id="unknown"></span></p>

    <h2>Guess history</h2>
    <ul id="history"></ul>

    <hr>
    <h2>Debug</h2>
    <button onclick="reinitialise()">Re-initialise session</button>
    <button onclick="newWord()">Reset (new word)</button>
    <button onclick="clearHistory()">Clear history display</button>
    <p>Current WORDLE_HASH: <span id="hashDisplay"></span></p>
    <p>Last raw response:</p>
    <pre id="debugOutput">(none yet)</pre>

    <script>
        // only two things need to travel with a guess request: the guess itself,
        // and the hash proving this client's state matches the server's session
        let wordleHash = "";

        async function callApi(cmd, guess) {
            const payload = { cmd: cmd, WORDLE_HASH: wordleHash };
            if (guess !== undefined) {
                payload.GUESS = guess;
            }

            const response = await fetch("/api", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ api_v2_data: payload })
            });
            const data = await response.json();

            document.getElementById("debugOutput").textContent = JSON.stringify(data, null, 2);
            if (data && data.WORDLE_HASH) {
                wordleHash = data.WORDLE_HASH;
                document.getElementById("hashDisplay").textContent = wordleHash;
            }
            return data;
        }

        async function reinitialise() {
            await callApi("initialise");
        }
        reinitialise();

        async function submitGuess() {
            const guess = document.getElementById("guessInput").value.toLowerCase();
            if (guess.length !== 5) {
                document.getElementById("status").textContent = "Guess must be 5 letters";
                return;
            }

            const data = await callApi("get_Guess_Result", guess);

            if (!data) {
                document.getElementById("status").textContent = "Server returned no data — check console/logs";
                return;
            }
            if (data.error) {
                document.getElementById("status").textContent = data.error;
                return;
            }

            document.getElementById("status").textContent = data.user_guess_status || "";
            document.getElementById("known").textContent =
                data.result_known_positions ? Object.values(data.result_known_positions).join("") : "";
            document.getElementById("unknown").textContent =
                (data.result_unknown_positions || []).join(", ");

            const li = document.createElement("li");
            li.textContent = guess + " -> " + (data.user_guess_status || "");
            document.getElementById("history").appendChild(li);

            if (data.user_guess_status === "Correct" || data.user_guess_status === "Maximum guesses reached") {
                if (data.answer) {
                    document.getElementById("status").textContent += " (answer: " + data.answer + ")";
                }
            }

            document.getElementById("guessInput").value = "";
        }

        async function newWord() {
            const data = await callApi("Generate_New_Word");
            document.getElementById("status").textContent = data.user_guess_status || "";
            document.getElementById("known").textContent = "";
            document.getElementById("unknown").textContent = "";
            clearHistory();
        }

        function clearHistory() {
            document.getElementById("history").innerHTML = "";
        }
    </script>
</body>
</html>
