<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Play Wordle</title>
    <script src="/play/js/5-letter.js" defer></script>
</head>
<body>
    <h1>Play Wordle</h1>

    <input type="text" id="guessInput" maxlength="5" placeholder="5-letter word">
    <button type="button" id="guessButton">Guess</button>
    <button type="button" id="newWordButton">New Word</button>

    <p>Status: <span id="status"></span></p>
    <p>Known positions: <span id="known"></span></p>
    <p>Known letters (wrong position): <span id="unknown"></span></p>

    <h2>Guess history</h2>
    <ul id="history"></ul>

    <hr>
    <h2>Debug</h2>
    <button type="button" id="reinitialiseButton">Re-initialise session</button>
    <script src="/play/js/main.js" defer></script>
</body>
</html>
