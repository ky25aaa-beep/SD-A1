<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle - character States</title>
    <style>
        body {
            background: #15161b;
            color: #eceef2;
            font-family: monospace;
            text-align: center;
            padding: 2rem;
        }

        .character {
            display: inline-grid;
            place-items: center;
            width: 2.6rem;
            height: 2.6rem;
            margin: 0.2px;
            margin-top: 5px;
            font-size: 1.3rem; /* half of 2.6rem width and height */
            font-weight: bold;
        }

        /* correct letter, correct position */
        .known { background: #4f9d69; }

        /* correct letter, wrong position */
        .unknown { background: #f2b134; color: #1a1200; }

        /* letter not in the word */
        .absent { background: #1e2027; color: #8a8d99; }
        li, ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>
    <main>
        <h1 class="characters" aria-label="Wordle">
            <span>W</span><span>O</span><span>R</span><span>D</span><span>L</span><span>E</span>
        </h1>
        <p class="tagline">character states used to mark a guess</p>

        <ul class="key">
            <li><span class="character known">A</span> known position — right letter, right spot (<code>.character.known</code>)</li>
            <li><span class="character unknown">A</span> unknown position — right letter, wrong spot (<code>.character.unknown</code>)</li>
            <li><span class="character absent">A</span> not in word — letter isn't in the answer (<code>.character.absent</code>)</li>
        </ul>

        <div class="board">
            <div class="row">
                <span class="character known">H</span>
                <span class="character known">E</span>
                <span class="character known">L</span>
                <span class="character known">L</span>
                <span class="character known">O</span>
            </div>
            <div class="row">
                <span class="character unknown">N</span>
                <span class="character unknown">E</span>
                <span class="character unknown">W</span>
            </div>
            <div class="row">
                <span class="character absent">W</span>
                <span class="character absent">O</span>
                <span class="character absent">R</span>
                <span class="character absent">L</span>
                <span class="character absent">D</span>
            </div>
        </div>
    </main>
</body>
</html>
